name: release

# Tag-driven release: `git tag v0.1.0 && git push origin v0.1.0` builds all
# six platforms, attaches routre_{GOOS}_{GOARCH}.tar.gz (+ .zip for
# windows) and a checksums.txt to the GitHub Release. install.sh and
# `routre update` consume exactly these asset names — do not rename.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"

      - name: Build release binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          build() {
            local goos="$1" goarch="$2" arc="$3"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/routre .
            if [ "$goos" = "windows" ]; then
              mv dist/routre dist/routre.exe
              (cd dist && zip -q "routre_windows_${arc}.zip" routre.exe)
              rm dist/routre.exe
            else
              tar czf "dist/routre_${goos}_${arc}.tar.gz" -C dist routre
              rm dist/routre
            fi
          }
          build linux   amd64 amd64
          build linux   arm64 arm64
          build darwin  amd64 amd64
          build darwin  arm64 arm64
          build windows amd64 amd64
          build windows arm64 arm64

      - name: Generate checksums
        run: |
          cd dist
          sha256sum routre_*.tar.gz routre_*.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: |
            dist/routre_*.tar.gz
            dist/routre_*.zip
            dist/checksums.txt
          generate_release_notes: true
