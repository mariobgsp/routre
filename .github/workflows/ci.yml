name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"
      - name: gofmt
        run: test -z "$(gofmt -l . | grep -v '^npm/')"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: race
        run: go test -race ./...
      - name: bench gate
        run: go run . bench -config config.example.json -target 90
      - name: fuzz smoke
        run: |
          go test ./internal/proxy -run=^$ -fuzz=FuzzSSEFrame -fuzztime=30s
          go test ./internal/rtk -run=^$ -fuzz=FuzzRTKApply -fuzztime=30s
